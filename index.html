<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Satranç Saati</title>
<style>
  :root {
    --page: #1a1a1a;
    --line: #3a3a3a;
    --muted: #9a9a9a;
    --sheet: #000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%;
    background: var(--page);
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* ---------- Saat ekranı ---------- */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .player {
    --bg-on: #f2f2f2; --fg-on: #111; --edge-on: transparent;
    --bg-off: #333; --fg-off: #888; --edge-off: transparent;
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    margin: 6px;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.6vh;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: var(--bg-off);
    color: var(--fg-off);
    box-shadow: inset 0 0 0 1px var(--edge-off);
    transition: flex-grow .3s cubic-bezier(.2, .8, .2, 1), background-color .15s, color .15s, box-shadow .15s;
  }
  .player.top { transform: rotate(180deg); }
  /* Sırası gelen oyuncunun alanı büyür */
  .player.active {
    flex-grow: 1.4;
    background: var(--bg-on);
    color: var(--fg-on);
    box-shadow: inset 0 0 0 2px var(--edge-on);
  }
  .app.paused .player.active {
    background: var(--bg-off);
    color: var(--fg-off);
    box-shadow: inset 0 0 0 1px var(--edge-off);
  }
  /* Son 10 saniye: alan yanıp söner */
  .player.low::after {
    content: '';
    position: absolute;
    inset: 0;
    background: currentColor;
    opacity: 0;
    pointer-events: none;
    animation: flash 1s steps(1) infinite;
  }
  @keyframes flash { 50% { opacity: .22; } }

  .time {
    font-size: min(24vw, 17vh);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
    transform: scale(.84);
    transition: transform .3s cubic-bezier(.2, .8, .2, 1);
  }
  .player.active .time { transform: none; }
  .hint, .meta {
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .8;
    min-height: 1.2em;
    padding: 0 12px;
    text-align: center;
  }
  .player.lost .hint { opacity: 1; font-weight: 700; font-size: 16px; }

  .bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    padding: 2px 0;
  }
  .bar button {
    width: 56px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: #0d0d0d;
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .bar button:disabled { opacity: .3; cursor: default; }
  .bar button:not(:disabled):active { background: #333; }
  .bar svg { width: 22px; height: 22px; }

  /* Masaüstü + yatay ekran: yan yana, döndürme yok */
  @media (orientation: landscape) and (pointer: fine) {
    .app { flex-direction: row; }
    .player.top { transform: none; }
    .bar { flex-direction: column; padding: 0 2px; }
    .time { font-size: min(12vw, 28vh); }
  }
  @media (prefers-reduced-motion: reduce) {
    .player, .time { transition: none; }
  }

  /* ---------- Kurulum ekranı ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: var(--sheet);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .sheet {
    width: 100%;
    max-width: 460px;
    min-height: 100%;
    margin: 0 auto;
    padding: calc(22px + env(safe-area-inset-top)) 16px 0;
    display: flex;
    flex-direction: column;
    background: var(--sheet);
  }
  @media (min-width: 640px) and (min-height: 720px) {
    .overlay { background: rgba(0, 0, 0, .85); padding: 32px 16px; }
    .sheet {
      --sheet: #0d0d0d;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 26px 24px 0;
    }
  }
  .sheet h2 { font-size: 24px; font-weight: 600; }
  .sheet .lead { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .sheet h3 {
    font-size: 16px;
    font-weight: 600;
    margin: 28px 0 12px;
    padding-top: 18px;
    border-top: 1px solid #222;
  }
  .sheet h3 .num { color: var(--muted); font-weight: 400; margin-right: 6px; }
  .label {
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 16px 0 8px;
  }
  .sheet button {
    font: inherit;
    color: #fff;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 6px;
    cursor: pointer;
  }
  .sheet button.on { background: #fff; color: #000; border-color: #fff; }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .row .name { flex: 1 1 100%; font-size: 14px; color: #cfcfcf; }
  .row.disabled { opacity: .35; }
  .sheet input[type=number] {
    width: 72px;
    font: inherit;
    font-variant-numeric: tabular-nums;
    color: #fff;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
  }
  .sheet input[type=number]:focus { outline: 2px solid #fff; outline-offset: 1px; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 15px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: #fff; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 10px; }

  .dot, .chip {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: -2px;
    box-shadow: 0 0 0 1px rgba(128, 128, 128, .8);
  }
  .dot.bw { background: linear-gradient(90deg, #fff 50%, #000 50%); }
  .dot.rainbow {
    background: conic-gradient(#e53935, #fb8c00, #fdd835, #9ccc65, #2e7d32, #26c6da,
      #1976d2, #283593, #8e24aa, #f06292, #8b1e3f, #e53935);
  }
  .pick-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 18px;
    font-size: 14px;
    color: #cfcfcf;
  }
  .pick-name { font-size: 13px; color: var(--muted); }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-top: 10px; }
  .sheet .swatch { aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%; }
  .sheet .swatch.on { box-shadow: 0 0 0 3px var(--sheet), 0 0 0 6px #fff; }
  /* Rakibin seçtiği renk: soluk ve üstü çizili */
  .sheet .swatch:disabled {
    opacity: .4;
    cursor: not-allowed;
    background-image: linear-gradient(to top right,
      transparent calc(50% - 2px), #000 calc(50% - 2px), #000 calc(50% + 2px), transparent calc(50% + 2px));
  }

  .actions {
    position: sticky;
    bottom: 0;
    margin-top: auto;
    padding: 14px 0 calc(16px + env(safe-area-inset-bottom));
    background: var(--sheet);
    border-top: 1px solid #222;
  }
  .sound { margin-bottom: 24px; }
  .missing, .actions .sub { text-align: center; margin: 0 0 10px; }
  .missing { font-size: 13px; color: var(--muted); }
  .buttons { display: flex; gap: 10px; }
  .buttons button { flex: 1; padding: 14px 6px; font-size: 16px; }
  .sheet button.primary { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
  .sheet button.primary:disabled { opacity: .3; cursor: default; }
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <div class="player top" id="p0">
    <div class="hint" id="h0"></div>
    <div class="time" id="t0"></div>
    <div class="meta" id="m0"></div>
  </div>

  <div class="bar">
    <button id="btnPlay" aria-label="Başlat / Duraklat / Devam et">
      <svg viewBox="0 0 24 24" fill="currentColor"><path id="playIcon" d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="btnReset" aria-label="Aynı ayarlarla sıfırla">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/></svg>
    </button>
    <button id="btnSettings" aria-label="Yeni oyun / ayarlar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>

  <div class="player bottom" id="p1">
    <div class="hint" id="h1"></div>
    <div class="time" id="t1"></div>
    <div class="meta" id="m1"></div>
  </div>
</div>

<div class="overlay" id="setup" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h2 id="setupTitle">Yeni oyun</h2>
    <p class="lead">Süreyi, renkleri ve kimin başlayacağını seç.</p>

    <h3><span class="num">1</span>Süre</h3>
    <div class="presets" id="presets">
      <button data-min="1"  data-inc="0">1+0</button>
      <button data-min="3"  data-inc="0">3+0</button>
      <button data-min="3"  data-inc="2">3+2</button>
      <button data-min="5"  data-inc="0">5+0</button>
      <button data-min="5"  data-inc="3">5+3</button>
      <button data-min="10" data-inc="0">10+0</button>
      <button data-min="15" data-inc="10">15+10</button>
      <button data-min="30" data-inc="0">30+0</button>
    </div>

    <div class="label">Artış</div>
    <div class="seg" id="modeSeg">
      <button data-mode="none">Artış yok</button>
      <button data-mode="fischer">Fischer</button>
    </div>
    <div class="row" id="incRow">
      <span>Her hamleden sonra</span>
      <input type="number" id="inc" min="0" max="600" inputmode="numeric" placeholder="0">
      <span>sn ekle</span>
    </div>

    <div class="label">Özel süre</div>
    <div class="row">
      <span class="name" id="lbl0">Her iki oyuncu</span>
      <input type="number" id="min0" min="0" max="600" inputmode="numeric" placeholder="0"> <span>dk</span>
      <input type="number" id="sec0" min="0" max="59" inputmode="numeric" placeholder="0"> <span>sn</span>
    </div>
    <div class="row" id="row1" hidden>
      <span class="name" id="lbl1">Alttaki oyuncu</span>
      <input type="number" id="min1" min="0" max="600" inputmode="numeric" placeholder="0"> <span>dk</span>
      <input type="number" id="sec1" min="0" max="59" inputmode="numeric" placeholder="0"> <span>sn</span>
    </div>
    <label class="check"><input type="checkbox" id="split"> Oyunculara farklı süre ver</label>

    <h3><span class="num">2</span>Renk</h3>
    <div class="seg" id="colorSeg">
      <button data-cm="bw"><span class="dot bw"></span>Siyah / Beyaz</button>
      <button data-cm="color"><span class="dot rainbow"></span>Renkli</button>
    </div>
    <div id="colorPick" hidden>
      <div class="pick-head"><span id="cl0">Üstteki oyuncu</span><span class="pick-name" id="cn0"></span></div>
      <div class="swatches" id="sw0"></div>
      <div class="pick-head"><span id="cl1">Alttaki oyuncu</span><span class="pick-name" id="cn1"></span></div>
      <div class="swatches" id="sw1"></div>
    </div>

    <h3><span class="num">3</span>Kim başlıyor?</h3>
    <div class="seg" id="starterSeg">
      <button data-s="0"><span class="chip"></span><span class="txt">Üstteki</span></button>
      <button data-s="1"><span class="chip"></span><span class="txt">Alttaki</span></button>
    </div>
    <p class="sub" id="bwNote">Başlayan oyuncu beyaz olur.</p>

    <label class="check sound"><input type="checkbox" id="sound"> Ses</label>

    <div class="actions">
      <p class="missing" id="missing"></p>
      <p class="sub" id="resetNote" hidden>Tamam'a basınca saat sıfırlanır.</p>
      <div class="buttons">
        <button id="cancel">Vazgeç</button>
        <button id="ok" class="primary">Tamam</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  // ---------- Sabitler ----------
  const COLORS = [
    { name: 'Kırmızı',    hex: '#e53935' },
    { name: 'Turuncu',    hex: '#fb8c00' },
    { name: 'Sarı',       hex: '#fdd835' },
    { name: 'Açık yeşil', hex: '#9ccc65' },
    { name: 'Yeşil',      hex: '#2e7d32' },
    { name: 'Turkuaz',    hex: '#26c6da' },
    { name: 'Mavi',       hex: '#1976d2' },
    { name: 'Lacivert',   hex: '#283593' },
    { name: 'Mor',        hex: '#8e24aa' },
    { name: 'Pembe',      hex: '#f06292' },
    { name: 'Bordo',      hex: '#8b1e3f' },
    { name: 'Kahverengi', hex: '#6d4c41' },
  ];
  const LOW_MS = 10000;
  const MAX_MS = 10 * 3600 * 1000;
  const STORE_KEY = 'satranc-saati-v2';
  const ICON_PLAY = 'M8 5v14l11-7z';
  const ICON_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';

  // Oyuncu 0 = üst (masaüstünde sol), oyuncu 1 = alt (masaüstünde sağ)
  const app = $('#app');
  const panels = [$('#p0'), $('#p1')];
  const timeEls = [$('#t0'), $('#t1')];
  const hintEls = [$('#h0'), $('#h1')];
  const metaEls = [$('#m0'), $('#m1')];
  const btnPlay = $('#btnPlay');
  const playIcon = $('#playIcon');

  const pad = (n) => String(n).padStart(2, '0');
  const toNum = (el, max) => Math.min(max, Math.max(0, Math.floor(Number(el.value) || 0)));

  // ---------- Ayarların saklanması ----------
  function isValidCfg(c) {
    if (!c || typeof c !== 'object') return false;
    if (!Array.isArray(c.t) || c.t.length !== 2) return false;
    if (!c.t.every((x) => Number.isFinite(x) && x > 0 && x <= MAX_MS)) return false;
    if (c.starter !== 0 && c.starter !== 1) return false;
    if (c.mode !== 'none' && c.mode !== 'fischer') return false;
    if (!Number.isFinite(c.inc) || c.inc < 0) return false;
    if (c.colorMode === 'bw') return true;
    if (c.colorMode !== 'color' || !Array.isArray(c.colors)) return false;
    const [a, b] = c.colors;
    return [a, b].every((i) => Number.isInteger(i) && i >= 0 && i < COLORS.length) && a !== b;
  }
  function loadCfg() {
    try {
      const c = JSON.parse(localStorage.getItem(STORE_KEY));
      if (isValidCfg(c)) return { split: false, sound: true, colors: [null, null], ...c };
    } catch (e) { /* depolama yoksa kurulum boş başlar */ }
    return null;
  }
  function saveCfg() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch (e) { /* yoksay */ }
  }

  let cfg = loadCfg(); // ilk ziyarette null: kurulum yapılmadan saat açılmaz
  let st = null;

  // ---------- Renk temaları ----------
  const hexToRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const toCss = (c) => `rgb(${c.map((v) => Math.round(v)).join(', ')})`;
  function luminance(c) {
    const [r, g, b] = c.map((v) => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  const contrast = (a, b) => (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
  function textOn(c) {
    const L = luminance(c);
    const onWhite = contrast(L, 1);
    const onDark = contrast(L, luminance([17, 17, 17]));
    return onWhite >= 4 || onWhite >= onDark ? '#fff' : '#111';
  }

  const BW_WHITE = {
    '--bg-on': '#f2f2f2', '--fg-on': '#111', '--edge-on': 'transparent',
    '--bg-off': '#9a9a9a', '--fg-off': 'rgba(0,0,0,.6)', '--edge-off': 'transparent',
  };
  const BW_BLACK = {
    '--bg-on': '#000', '--fg-on': '#fff', '--edge-on': 'rgba(255,255,255,.45)',
    '--bg-off': '#000', '--fg-off': 'rgba(255,255,255,.38)', '--edge-off': 'rgba(255,255,255,.1)',
  };
  function colorTheme(hex) {
    const c = hexToRgb(hex);
    return {
      '--bg-on': hex, '--fg-on': textOn(c), '--edge-on': 'transparent',
      '--bg-off': toCss(c.map((v) => v * 0.5)), '--fg-off': 'rgba(255,255,255,.62)', '--edge-off': 'transparent',
    };
  }
  function themeFor(p) {
    if (cfg.colorMode === 'color') return colorTheme(COLORS[cfg.colors[p]].hex);
    return p === cfg.starter ? BW_WHITE : BW_BLACK; // beyaz başlar
  }
  function applyTheme() {
    panels.forEach((el, p) => {
      for (const [k, v] of Object.entries(themeFor(p))) el.style.setProperty(k, v);
    });
  }

  // ---------- Biçimlendirme ----------
  function fmt(ms) {
    if (ms <= 0) return '0.0';
    if (ms < LOW_MS) return (Math.floor(ms / 100) / 10).toFixed(1);
    const s = Math.ceil(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
  }
  function fmtControl(p) {
    const total = Math.round(cfg.t[p] / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    const base = s ? `${m}:${pad(s)}` : `${m}`;
    return `${base} + ${cfg.mode === 'fischer' ? cfg.inc : 0}`;
  }

  // ---------- Saat motoru ----------
  let raf = 0;

  function reset() {
    cancelAnimationFrame(raf);
    applyTheme();
    st = {
      time: [cfg.t[0], cfg.t[1]],
      active: cfg.starter,  // hazırda bekleyen: ilk hamleyi yapacak oyuncu
      status: 'ready',      // ready | running | paused | over
      moves: [0, 0],
      last: 0,
      loser: null,
    };
    releaseWake();
    app.hidden = false;
    render();
  }

  function begin() {
    if (st.status !== 'ready') return;
    st.status = 'running';
    st.last = performance.now();
    requestWake();
    loop();
    knock();
    render();
  }

  // Oyuncu p kendi alanına dokundu: hamlesini bitirdi.
  function press(p) {
    if (!st) return;
    if (st.status === 'ready') { begin(); return; }
    if (st.status !== 'running' || st.active !== p) return;
    tick();
    if (st.status !== 'running') return;
    st.moves[p]++;
    if (cfg.mode === 'fischer') st.time[p] += cfg.inc * 1000;
    st.active = 1 - p;
    st.last = performance.now();
    knock();
    render();
  }

  function pause() {
    if (!st || st.status !== 'running') return;
    tick();
    if (st.status !== 'running') return;
    st.status = 'paused';
    cancelAnimationFrame(raf);
    releaseWake();
    render();
  }

  function resume() {
    if (!st || st.status !== 'paused') return;
    st.status = 'running';
    st.last = performance.now();
    requestWake();
    loop();
    render();
  }

  // Gerçek geçen süreyi düş (setInterval sayımı gibi kaymaz).
  function tick() {
    const now = performance.now();
    const a = st.active;
    st.time[a] -= now - st.last;
    st.last = now;
    if (st.time[a] <= 0) {
      st.time[a] = 0;
      st.status = 'over';
      st.loser = a;
      cancelAnimationFrame(raf);
      releaseWake();
      alarm();
      render();
    }
  }

  function loop() {
    cancelAnimationFrame(raf);
    const frame = () => {
      if (st.status !== 'running') return;
      tick();
      if (st.status === 'running') {
        renderPlayer(st.active);
        raf = requestAnimationFrame(frame);
      }
    };
    raf = requestAnimationFrame(frame);
  }

  // Sekme arka plandayken rAF durur; süre bitişini yine de yakala.
  setInterval(() => { if (st && st.status === 'running') tick(); }, 250);

  // ---------- Çizim ----------
  function renderPlayer(p) {
    const el = panels[p];
    const over = st.status === 'over';
    el.classList.toggle('active', over ? st.loser !== p : st.active === p);
    el.classList.toggle('lost', over && st.loser === p);
    el.classList.toggle('low', st.status === 'running' && st.active === p && st.time[p] < LOW_MS);
    timeEls[p].textContent = fmt(st.time[p]);
  }

  function hintFor(p) {
    switch (st.status) {
      case 'ready': return p === st.active ? 'Başlamak için dokun' : 'Rakibin başlayacak';
      case 'paused': return p === st.active ? 'Duraklatıldı' : '';
      case 'over': return p === st.loser ? 'Süre doldu' : 'Kazandı';
      default: return '';
    }
  }

  function render() {
    if (!st) return;
    app.classList.toggle('paused', st.status === 'paused');
    for (const p of [0, 1]) {
      renderPlayer(p);
      hintEls[p].textContent = hintFor(p);
      metaEls[p].textContent = st.status === 'ready' ? fmtControl(p) : `Hamle ${st.moves[p]}`;
    }
    playIcon.setAttribute('d', st.status === 'running' ? ICON_PAUSE : ICON_PLAY);
    btnPlay.disabled = st.status === 'over';
  }

  // ---------- Ses (Web Audio, dosya gerekmez) ----------
  let ac = null;
  let noise = null;
  const soundOn = () => !!(cfg && cfg.sound);

  function audio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = ac || new AC();
      if (ac.state !== 'running') ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  function noiseBuffer(a) {
    if (!noise || noise.sampleRate !== a.sampleRate) {
      const len = Math.floor(a.sampleRate * 0.03);
      noise = a.createBuffer(1, len, a.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return noise;
  }
  // Tok bir vuruş: perdesi hızla düşen alçak bir ton ve boğuk, kısa bir tık.
  function knock(force = false) {
    if (!force && !soundOn()) return;
    const a = audio();
    if (!a) return;
    const t = a.currentTime + 0.002;
    const lp = a.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1500;
    lp.connect(a.destination);

    const o = a.createOscillator();
    const g = a.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(320, t);
    o.frequency.exponentialRampToValueAtTime(150, t + 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.8, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g).connect(lp);
    o.start(t);
    o.stop(t + 0.16);

    const n = a.createBufferSource();
    const ng = a.createGain();
    n.buffer = noiseBuffer(a);
    ng.gain.setValueAtTime(0.3, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.025);
    n.connect(ng).connect(lp);
    n.start(t);
  }
  // Süre bitti: üç alçak, yumuşak bip.
  function alarm() {
    if (!soundOn()) return;
    const a = audio();
    if (!a) return;
    [0, 0.3, 0.6].forEach((w) => {
      const t = a.currentTime + w;
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = 'triangle';
      o.frequency.value = 392;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.6, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
      o.connect(g).connect(a.destination);
      o.start(t);
      o.stop(t + 0.28);
    });
  }
  // Telefonlarda ses ancak bir dokunuşla açılabilir; her dokunuşta hazır tut.
  document.addEventListener('pointerup', () => { if (soundOn()) audio(); });

  // ---------- Ekranı açık tut ----------
  let wake = null;
  async function requestWake() {
    try {
      if ('wakeLock' in navigator && !wake) {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      }
    } catch (e) { /* desteklenmiyor */ }
  }
  function releaseWake() {
    try { if (wake) wake.release(); } catch (e) { /* yoksay */ }
    wake = null;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && st && st.status === 'running') requestWake();
  });

  // ---------- Saat kontrolleri ----------
  panels.forEach((el, p) => {
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); press(p); });
  });

  function togglePlay() {
    if (!st) return;
    if (st.status === 'running') pause();
    else if (st.status === 'paused') resume();
    else if (st.status === 'ready') begin();
  }

  function askReset() {
    if (!st) return;
    if (st.status === 'running' || st.status === 'paused') {
      pause();
      if (!confirm('Saat aynı ayarlarla sıfırlansın mı?')) return;
    }
    reset();
  }

  // Tıklanan düğme odakta kalmasın; yoksa Boşluk tuşu onu da tetikler.
  const barClick = (fn) => (e) => { e.currentTarget.blur(); fn(); };
  btnPlay.addEventListener('click', barClick(togglePlay));
  $('#btnReset').addEventListener('click', barClick(askReset));
  $('#btnSettings').addEventListener('click', barClick(openSetup));

  document.addEventListener('keydown', (e) => {
    if (!setup.hidden) {
      if (e.key === 'Escape' && st) closeSetup();
      return;
    }
    if (!st) return;
    if (e.code === 'Space') {
      e.preventDefault();
      if (st.status === 'ready') begin();
      else if (st.status === 'running') press(st.active);
      else if (st.status === 'paused') resume();
    } else if (e.key === 'p' || e.key === 'P') {
      togglePlay();
    } else if (e.key === 'r' || e.key === 'R') {
      askReset();
    }
  });

  // ---------- Kurulum ekranı ----------
  const setup = $('#setup');
  const f = {
    inc: $('#inc'), min0: $('#min0'), sec0: $('#sec0'), min1: $('#min1'), sec1: $('#sec1'),
    split: $('#split'), sound: $('#sound'), ok: $('#ok'), cancel: $('#cancel'),
  };
  let draft = null;

  const sideMQ = window.matchMedia('(orientation: landscape) and (pointer: fine)');
  const sideNames = () => (sideMQ.matches ? ['Soldaki', 'Sağdaki'] : ['Üstteki', 'Alttaki']);

  function buildSwatches() {
    for (const p of [0, 1]) {
      const box = $('#sw' + p);
      COLORS.forEach((c, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'swatch';
        b.style.backgroundColor = c.hex;
        b.dataset.i = i;
        b.title = c.name;
        b.setAttribute('aria-label', c.name);
        box.appendChild(b);
      });
    }
  }

  function setTime(minEl, secEl, ms) {
    const s = Math.round(ms / 1000);
    minEl.value = Math.floor(s / 60);
    secEl.value = s % 60;
  }
  const readTime = (minEl, secEl) => (toNum(minEl, 600) * 60 + toNum(secEl, 59)) * 1000;

  function openSetup() {
    pause();
    const c = cfg;
    draft = {
      mode: c ? c.mode : 'none',
      split: c ? c.split : false,
      sound: c ? c.sound : true,
      colorMode: c ? c.colorMode : 'bw',
      colors: c ? [...c.colors] : [null, null],
      starter: c ? c.starter : null,
    };
    f.inc.value = c && c.inc ? c.inc : '';
    if (c) {
      setTime(f.min0, f.sec0, c.t[0]);
      setTime(f.min1, f.sec1, c.t[1]);
    } else {
      f.min0.value = f.sec0.value = f.min1.value = f.sec1.value = '';
    }
    f.split.checked = draft.split;
    f.sound.checked = draft.sound;
    f.cancel.hidden = !st;
    $('#resetNote').hidden = !(st && st.status === 'paused');
    renderSetup();
    setup.hidden = false;
    setup.scrollTop = 0;
  }
  function closeSetup() { setup.hidden = true; }

  function missingItems() {
    const out = [];
    const t0 = readTime(f.min0, f.sec0);
    const t1 = draft.split ? readTime(f.min1, f.sec1) : t0;
    if (t0 <= 0 || t1 <= 0) out.push('süre');
    if (draft.colorMode === 'color' && (draft.colors[0] == null || draft.colors[1] == null)) out.push('renkler');
    if (draft.starter == null) out.push('başlayan oyuncu');
    return out;
  }

  function chipColor(p) {
    if (draft.colorMode === 'color') return draft.colors[p] == null ? null : COLORS[draft.colors[p]].hex;
    if (draft.starter == null) return null;
    return p === draft.starter ? '#fff' : '#000';
  }

  function renderSetup() {
    const names = sideNames();

    // 1 · Süre
    for (const b of $$('#modeSeg button')) b.classList.toggle('on', b.dataset.mode === draft.mode);
    const noInc = draft.mode === 'none';
    f.inc.disabled = noInc;
    $('#incRow').classList.toggle('disabled', noInc);
    $('#row1').hidden = !draft.split;
    $('#lbl0').textContent = draft.split ? `${names[0]} oyuncu` : 'Her iki oyuncu';
    $('#lbl1').textContent = `${names[1]} oyuncu`;
    const inc = noInc ? 0 : toNum(f.inc, 600);
    const min0 = toNum(f.min0, 600);
    const sec0 = toNum(f.sec0, 59);
    for (const b of $$('#presets button')) {
      b.classList.toggle('on', !draft.split && min0 === +b.dataset.min && sec0 === 0 && inc === +b.dataset.inc);
    }

    // 2 · Renk
    for (const b of $$('#colorSeg button')) b.classList.toggle('on', b.dataset.cm === draft.colorMode);
    $('#colorPick').hidden = draft.colorMode !== 'color';
    for (const p of [0, 1]) {
      const sel = draft.colors[p];
      $('#cl' + p).textContent = `${names[p]} oyuncu`;
      $('#cn' + p).textContent = sel == null ? 'Seçilmedi' : COLORS[sel].name;
      for (const b of $$(`#sw${p} .swatch`)) {
        const i = +b.dataset.i;
        b.classList.toggle('on', i === sel);
        b.setAttribute('aria-pressed', String(i === sel));
        b.disabled = i === draft.colors[1 - p]; // rakibin rengi seçilemez
      }
    }

    // 3 · Kim başlıyor
    for (const b of $$('#starterSeg button')) {
      const p = +b.dataset.s;
      b.classList.toggle('on', p === draft.starter);
      b.querySelector('.txt').textContent = names[p];
      const chip = b.querySelector('.chip');
      const col = chipColor(p);
      chip.hidden = !col;
      if (col) chip.style.background = col;
    }
    $('#bwNote').hidden = draft.colorMode !== 'bw';

    const miss = missingItems();
    $('#missing').hidden = miss.length === 0;
    $('#missing').textContent = miss.length ? `Seçilmesi gereken: ${miss.join(', ')}` : '';
    f.ok.disabled = miss.length > 0;
  }

  $('#presets').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    f.min0.value = b.dataset.min;
    f.sec0.value = 0;
    f.inc.value = b.dataset.inc;
    draft.mode = +b.dataset.inc > 0 ? 'fischer' : 'none';
    draft.split = false;
    f.split.checked = false;
    renderSetup();
  });
  $('#modeSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    draft.mode = b.dataset.mode;
    if (draft.mode === 'fischer' && toNum(f.inc, 600) === 0) f.inc.value = 2;
    renderSetup();
  });
  f.split.addEventListener('change', () => {
    draft.split = f.split.checked;
    if (draft.split && f.min1.value === '' && f.sec1.value === '') {
      f.min1.value = f.min0.value;
      f.sec1.value = f.sec0.value;
    }
    renderSetup();
  });
  f.sound.addEventListener('change', () => {
    draft.sound = f.sound.checked;
    if (draft.sound) knock(true); // sesi duyup karar verebilsin
  });
  $('#colorSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    draft.colorMode = b.dataset.cm;
    renderSetup();
  });
  for (const p of [0, 1]) {
    $('#sw' + p).addEventListener('click', (e) => {
      const b = e.target.closest('.swatch');
      if (!b || b.disabled) return;
      draft.colors[p] = +b.dataset.i;
      renderSetup();
    });
  }
  $('#starterSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    draft.starter = +b.dataset.s;
    renderSetup();
  });
  setup.addEventListener('input', renderSetup);
  setup.addEventListener('focusin', (e) => { if (e.target.type === 'number') e.target.select(); });
  f.cancel.addEventListener('click', closeSetup);

  f.ok.addEventListener('click', () => {
    if (missingItems().length) return;
    const t0 = Math.min(MAX_MS, readTime(f.min0, f.sec0));
    const t1 = draft.split ? Math.min(MAX_MS, readTime(f.min1, f.sec1)) : t0;
    const inc = toNum(f.inc, 600);
    cfg = {
      t: [t0, t1],
      inc,
      mode: draft.mode === 'fischer' && inc > 0 ? 'fischer' : 'none',
      split: draft.split,
      sound: draft.sound,
      colorMode: draft.colorMode,
      colors: [...draft.colors],
      starter: draft.starter,
    };
    saveCfg();
    closeSetup();
    reset();
    if (cfg.sound) audio(); // telefonda sesi bu dokunuşla aç
  });

  if (sideMQ.addEventListener) {
    sideMQ.addEventListener('change', () => { if (!setup.hidden) renderSetup(); });
  }

  // ---------- Başlangıç: her açılışta kurulum ekranı ----------
  buildSwatches();
  openSetup();
})();
</script>
</body>
</html>
