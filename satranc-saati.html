<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Satranç Saati</title>
<style>
  :root {
    --black: #000;
    --ink: #111;
    --panel-off: #262626;
    --text-off: #6e6e6e;
    --line: #3a3a3a;
    --blink: #b5b5b5;
    --paper: #f2f2f2;
    --white: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* ---------- Ana yerleşim ---------- */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .player {
    flex: 1;
    margin: 6px;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2vh;
    cursor: pointer;
    background: var(--panel-off);
    color: var(--text-off);
    transition: background .12s, color .12s;
    position: relative;
  }
  .player.top { transform: rotate(180deg); }
  .player.active { background: var(--paper); color: var(--ink); }
  .app.paused .player.active { background: #8a8a8a; color: var(--ink); }
  .player.low { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { background: var(--blink); } }
  .player.lost {
    background: var(--black);
    color: var(--white);
    box-shadow: inset 0 0 0 3px var(--white);
  }

  .time {
    font-size: min(24vw, 19vh);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .hint, .meta {
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .75;
    min-height: 1.2em;
    text-align: center;
  }
  .player.lost .hint { opacity: 1; font-weight: 700; font-size: 16px; }

  /* ---------- Kontrol çubuğu ---------- */
  .bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    padding: 2px 0;
  }
  .bar button {
    width: 56px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--ink);
    color: var(--white);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .bar button:disabled { opacity: .3; cursor: default; }
  .bar button:not(:disabled):active { background: #333; }
  .bar svg { width: 22px; height: 22px; }

  /* Masaüstü + yatay ekran: yan yana, döndürme yok */
  @media (orientation: landscape) and (pointer: fine) {
    .app { flex-direction: row; }
    .player.top { transform: none; }
    .bar { flex-direction: column; padding: 0 2px; }
    .time { font-size: min(12vw, 28vh); }
  }

  /* ---------- Ayarlar penceresi ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .sheet {
    width: 100%;
    max-width: 420px;
    max-height: 100%;
    overflow-y: auto;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    -webkit-user-select: text;
    user-select: text;
  }
  .sheet h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
  .label {
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #9a9a9a;
    margin: 18px 0 8px;
  }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sheet button {
    font: inherit;
    color: var(--white);
    background: var(--black);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 6px;
    cursor: pointer;
  }
  .sheet button.on { background: var(--white); color: var(--black); border-color: var(--white); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .row[hidden] { display: none; }
  .row .name { flex: 1 1 100%; font-size: 14px; color: #cfcfcf; }
  .row.disabled { opacity: .35; }
  .sheet input[type=number] {
    width: 72px;
    font: inherit;
    font-variant-numeric: tabular-nums;
    color: var(--white);
    background: var(--black);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
  }
  .sheet input[type=number]:focus { outline: 2px solid var(--white); outline-offset: 1px; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 15px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: #fff; }
  .note { font-size: 12px; color: #8a8a8a; margin-top: 16px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .actions .primary { background: var(--white); color: var(--black); border-color: var(--white); font-weight: 600; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="player top" id="p0">
    <div class="hint" id="h0"></div>
    <div class="time" id="t0">5:00</div>
    <div class="meta" id="m0"></div>
  </div>

  <div class="bar">
    <button id="btnPlay" aria-label="Duraklat / Devam et">
      <svg viewBox="0 0 24 24" fill="currentColor"><path id="playIcon" d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="btnReset" aria-label="Sıfırla">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/></svg>
    </button>
    <button id="btnSettings" aria-label="Ayarlar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>

  <div class="player bottom" id="p1">
    <div class="hint" id="h1"></div>
    <div class="time" id="t1">5:00</div>
    <div class="meta" id="m1"></div>
  </div>
</div>

<div class="overlay" id="settings" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">Ayarlar</h2>

    <div class="label">Hazır süreler</div>
    <div class="presets" id="presets">
      <button data-min="1"  data-inc="0">1+0</button>
      <button data-min="3"  data-inc="0">3+0</button>
      <button data-min="3"  data-inc="2">3+2</button>
      <button data-min="5"  data-inc="0">5+0</button>
      <button data-min="5"  data-inc="3">5+3</button>
      <button data-min="10" data-inc="0">10+0</button>
      <button data-min="15" data-inc="10">15+10</button>
      <button data-min="30" data-inc="0">30+0</button>
    </div>

    <div class="label">Artış</div>
    <div class="seg" id="modeSeg">
      <button data-mode="none">Artış yok</button>
      <button data-mode="fischer">Fischer</button>
    </div>
    <div class="row" id="incRow">
      <span>Her hamleden sonra</span>
      <input type="number" id="inc" min="0" max="600" inputmode="numeric">
      <span>sn ekle</span>
    </div>

    <div class="label">Süre</div>
    <div class="row">
      <span class="name" id="lblA">Her iki oyuncu</span>
      <input type="number" id="minA" min="0" max="600" inputmode="numeric"> <span>dk</span>
      <input type="number" id="secA" min="0" max="59" inputmode="numeric"> <span>sn</span>
    </div>
    <div class="row" id="rowB" hidden>
      <span class="name">Üstteki oyuncu</span>
      <input type="number" id="minB" min="0" max="600" inputmode="numeric"> <span>dk</span>
      <input type="number" id="secB" min="0" max="59" inputmode="numeric"> <span>sn</span>
    </div>
    <label class="check"><input type="checkbox" id="split"> Oyunculara farklı süre ver</label>
    <label class="check"><input type="checkbox" id="sound"> Ses</label>

    <p class="note">Uygula'ya basınca saat sıfırlanır.</p>
    <div class="actions">
      <button id="cancel">Vazgeç</button>
      <button id="apply" class="primary">Uygula</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);

  // Oyuncu 0 = üst, oyuncu 1 = alt
  const app = $('#app');
  const panels = [$('#p0'), $('#p1')];
  const timeEls = [$('#t0'), $('#t1')];
  const hintEls = [$('#h0'), $('#h1')];
  const metaEls = [$('#m0'), $('#m1')];
  const btnPlay = $('#btnPlay');
  const playIcon = $('#playIcon');
  const ICON_PLAY = 'M8 5v14l11-7z';
  const ICON_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
  const LOW_MS = 10000;
  const STORE_KEY = 'satranc-saati-ayarlar';

  // ---------- Ayarlar ----------
  const DEFAULTS = { t: [300000, 300000], inc: 0, mode: 'none', split: false, sound: true };

  function loadCfg() {
    try {
      const c = JSON.parse(localStorage.getItem(STORE_KEY));
      if (c && Array.isArray(c.t) && c.t.length === 2 && c.t.every((x) => x > 0)) {
        return { ...DEFAULTS, ...c };
      }
    } catch (e) { /* depolama yoksa varsayılanlar */ }
    return { ...DEFAULTS };
  }
  function saveCfg() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch (e) { /* yoksay */ }
  }

  let cfg = loadCfg();
  let st;

  // ---------- Biçimlendirme ----------
  const pad = (n) => String(n).padStart(2, '0');

  function fmt(ms) {
    if (ms <= 0) return '0.0';
    if (ms < LOW_MS) return (Math.floor(ms / 100) / 10).toFixed(1);
    const s = Math.ceil(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
  }

  function fmtControl(ms) {
    const total = Math.round(ms / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    const base = s ? `${m}:${pad(s)}` : `${m}`;
    return `${base} + ${cfg.mode === 'fischer' ? cfg.inc : 0}`;
  }

  // ---------- Saat motoru ----------
  let raf = 0;

  function reset() {
    cancelAnimationFrame(raf);
    st = {
      time: [cfg.t[0], cfg.t[1]],
      active: null,
      status: 'ready',      // ready | running | paused | over
      moves: [0, 0],
      last: 0,
      loser: null,
    };
    releaseWake();
    render();
  }

  // Oyuncu p kendi alanına dokundu: hamlesini bitirdi.
  function press(p) {
    if (st.status === 'ready') {
      start(1 - p);
      click();
      return;
    }
    if (st.status !== 'running' || st.active !== p) return;
    tick();
    if (st.status !== 'running') return;
    st.moves[p]++;
    if (cfg.mode === 'fischer') st.time[p] += cfg.inc * 1000;
    st.active = 1 - p;
    st.last = performance.now();
    click();
    render();
  }

  function start(p) {
    st.active = p;
    st.status = 'running';
    st.last = performance.now();
    requestWake();
    loop();
    render();
  }

  function pause() {
    if (st.status !== 'running') return;
    tick();
    if (st.status !== 'running') return;
    st.status = 'paused';
    cancelAnimationFrame(raf);
    releaseWake();
    render();
  }

  function resume() {
    if (st.status !== 'paused') return;
    st.status = 'running';
    st.last = performance.now();
    requestWake();
    loop();
    render();
  }

  // Gerçek geçen süreyi düş (setInterval sayımı gibi kaymaz).
  function tick() {
    const now = performance.now();
    const a = st.active;
    st.time[a] -= now - st.last;
    st.last = now;
    if (st.time[a] <= 0) {
      st.time[a] = 0;
      st.status = 'over';
      st.loser = a;
      cancelAnimationFrame(raf);
      releaseWake();
      alarm();
      render();
    }
  }

  function loop() {
    cancelAnimationFrame(raf);
    const frame = () => {
      if (st.status !== 'running') return;
      tick();
      if (st.status === 'running') {
        renderPlayer(st.active);
        raf = requestAnimationFrame(frame);
      }
    };
    raf = requestAnimationFrame(frame);
  }

  // Sekme arka plandayken rAF durur; süre bitişini yine de yakala.
  setInterval(() => { if (st.status === 'running') tick(); }, 250);

  // ---------- Çizim ----------
  function renderPlayer(p) {
    const el = panels[p];
    const isActive = st.active === p && (st.status === 'running' || st.status === 'paused');
    el.classList.toggle('active', isActive);
    el.classList.toggle('low', isActive && st.status === 'running' && st.time[p] < LOW_MS);
    el.classList.toggle('lost', st.status === 'over' && st.loser === p);
    timeEls[p].textContent = fmt(st.time[p]);
  }

  function render() {
    app.classList.toggle('paused', st.status === 'paused');
    for (const p of [0, 1]) {
      renderPlayer(p);
      let hint = '';
      if (st.status === 'ready') hint = 'Dokun · rakibin saati başlar';
      else if (st.status === 'paused') hint = 'Duraklatıldı';
      else if (st.status === 'over') hint = st.loser === p ? 'Süre doldu' : 'Kazandı';
      hintEls[p].textContent = hint;
      metaEls[p].textContent = st.status === 'ready'
        ? fmtControl(cfg.t[p])
        : `Hamle ${st.moves[p]}`;
    }
    playIcon.setAttribute('d', st.status === 'running' ? ICON_PAUSE : ICON_PLAY);
    btnPlay.disabled = st.status === 'over';
  }

  // ---------- Ses (Web Audio, dosya gerekmez) ----------
  let ac = null;
  function audio() {
    if (!cfg.sound) return null;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  function tone(freq, dur, type, vol, when = 0) {
    const a = audio();
    if (!a) return;
    const t = a.currentTime + when;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  const click = () => tone(1800, 0.03, 'square', 0.06);
  const alarm = () => [0, 0.25, 0.5].forEach((w) => tone(880, 0.18, 'sine', 0.25, w));

  // ---------- Ekranı açık tut ----------
  let wake = null;
  async function requestWake() {
    try {
      if ('wakeLock' in navigator && !wake) {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      }
    } catch (e) { /* desteklenmiyor */ }
  }
  function releaseWake() {
    try { if (wake) wake.release(); } catch (e) { /* yoksay */ }
    wake = null;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && st.status === 'running') requestWake();
  });

  // ---------- Kontroller ----------
  panels.forEach((el, p) => {
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); press(p); });
  });

  function togglePlay() {
    if (st.status === 'running') pause();
    else if (st.status === 'paused') resume();
    else if (st.status === 'ready') { start(1); click(); }
  }

  function askReset() {
    const inGame = st.status === 'running' || st.status === 'paused';
    if (inGame) {
      pause();
      if (!confirm('Saat sıfırlansın mı?')) return;
    }
    reset();
  }

  btnPlay.addEventListener('click', togglePlay);
  $('#btnReset').addEventListener('click', askReset);
  $('#btnSettings').addEventListener('click', openSettings);

  document.addEventListener('keydown', (e) => {
    if (!settings.hidden) {
      if (e.key === 'Escape') closeSettings();
      return;
    }
    if (e.code === 'Space') {
      e.preventDefault();
      if (st.status === 'ready') press(0);
      else if (st.status === 'running') press(st.active);
      else if (st.status === 'paused') resume();
    } else if (e.key === 'p' || e.key === 'P') {
      togglePlay();
    } else if (e.key === 'r' || e.key === 'R') {
      askReset();
    }
  });

  // ---------- Ayarlar penceresi ----------
  const settings = $('#settings');
  const f = {
    inc: $('#inc'), minA: $('#minA'), secA: $('#secA'), minB: $('#minB'), secB: $('#secB'),
    split: $('#split'), sound: $('#sound'),
  };
  let formMode = cfg.mode;

  const toNum = (el, max) => Math.min(max, Math.max(0, Math.floor(Number(el.value) || 0)));

  function fillTime(minEl, secEl, ms) {
    const s = Math.round(ms / 1000);
    minEl.value = Math.floor(s / 60);
    secEl.value = s % 60;
  }

  function updateForm() {
    for (const b of document.querySelectorAll('#modeSeg button')) {
      b.classList.toggle('on', b.dataset.mode === formMode);
    }
    const none = formMode === 'none';
    f.inc.disabled = none;
    $('#incRow').classList.toggle('disabled', none);
    $('#rowB').hidden = !f.split.checked;
    $('#lblA').textContent = f.split.checked ? 'Alttaki oyuncu' : 'Her iki oyuncu';
    const inc = none ? 0 : toNum(f.inc, 600);
    for (const b of document.querySelectorAll('#presets button')) {
      const match = !f.split.checked
        && toNum(f.minA, 600) === +b.dataset.min && toNum(f.secA, 59) === 0
        && inc === +b.dataset.inc;
      b.classList.toggle('on', match);
    }
  }

  function openSettings() {
    pause();
    formMode = cfg.mode;
    f.inc.value = cfg.inc;
    fillTime(f.minA, f.secA, cfg.t[1]);
    fillTime(f.minB, f.secB, cfg.t[0]);
    f.split.checked = cfg.split;
    f.sound.checked = cfg.sound;
    updateForm();
    settings.hidden = false;
  }
  function closeSettings() { settings.hidden = true; }

  $('#presets').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    f.minA.value = b.dataset.min;
    f.secA.value = 0;
    f.inc.value = b.dataset.inc;
    formMode = +b.dataset.inc > 0 ? 'fischer' : 'none';
    f.split.checked = false;
    updateForm();
  });
  $('#modeSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    formMode = b.dataset.mode;
    if (formMode === 'fischer' && toNum(f.inc, 600) === 0) f.inc.value = 2;
    updateForm();
  });
  settings.addEventListener('input', updateForm);
  settings.addEventListener('focusin', (e) => { if (e.target.select) e.target.select(); });
  settings.addEventListener('pointerdown', (e) => { if (e.target === settings) closeSettings(); });
  $('#cancel').addEventListener('click', closeSettings);

  $('#apply').addEventListener('click', () => {
    const MAX = 10 * 3600 * 1000;
    const clampMs = (ms) => Math.min(MAX, Math.max(1000, ms));
    const a = clampMs((toNum(f.minA, 600) * 60 + toNum(f.secA, 59)) * 1000);
    const b = f.split.checked
      ? clampMs((toNum(f.minB, 600) * 60 + toNum(f.secB, 59)) * 1000)
      : a;
    const inc = toNum(f.inc, 600);
    cfg = {
      t: [b, a],
      inc,
      mode: formMode === 'fischer' && inc > 0 ? 'fischer' : 'none',
      split: f.split.checked,
      sound: f.sound.checked,
    };
    saveCfg();
    closeSettings();
    reset();
  });

  reset();
})();
</script>
</body>
</html>
